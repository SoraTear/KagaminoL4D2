hostname "鏡野屋 L4D2 Server"
sv_steamgroup "46739203"
sv_steamgroup_exclusive 1
//在引号内填写远程管理密码，引号内不填即为不设密码。
//使用rcon的两个必要条件：
//① 在服务器端开放游戏端口的tcp协议
//② 在l4d2服务器启动项里添加一条 +ip 0.0.0.0
rcon_password ""
//在引号内填写服务器密码，引号内不填即为不设密码
sv_password ""
//不允许从大厅选择组服务器来连接
sv_allow_lobby_connect_only 0
//在服务器浏览列表的中隐藏（防止别人恶意攻击服务器）
sv_tags hidden
//设定服务器可用的游戏模式
//coop合作；versus对抗；survival生还者；realism写实；scavenge清道夫
sv_gametypes "coop,versus,survival"
//设定当前游戏模式为合作战役
sm_cvar mp_gamemode coop
//游戏难度：easy简单；normal普通；hard高级；impossible专家
z_difficulty Hard
//设定服务器地区为亚洲
sv_region 4
//非局域网
sv_lan 0
//关闭模型(MOD)冲突
sv_consistency 0
//玩家进入服务器自动打开[今日消息]界面
motd_enabled 1
//关闭作弊
sv_cheats 0
//Tickrate Enabler：设置60tick
sm_cvar net_splitpacket_maxrate 30000
sm_cvar nb_update_frequency 0.024
sm_cvar tick_door_speed 1.3
sm_cvar fps_max 0
sm_cvar sv_minrate 60000
sm_cvar sv_maxrate 60000
sm_cvar sv_mincmdrate 60
sm_cvar sv_maxcmdrate 60
sm_cvar sv_minupdaterate 60
sm_cvar sv_maxupdaterate 60
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 2